apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nodejs

  template:
    metadata:
      labels:
        app: nodejs

    spec:
      containers:
      - name: nodejs

        image: kiranthorat8419/nodejs-app:17

        ports:
        - containerPort: 3000